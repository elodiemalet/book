name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run lint

      # Les tests d'import (.docx, .odt, .md) passent par pandoc
      - run: sudo apt-get update && sudo apt-get install -y pandoc

      - run: npm run test

      - run: npm run build
